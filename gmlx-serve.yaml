# 多模型泳道（2026-11-11 深夜改：125B + 27B + 9B 三条泳道）
# ----------------------------------------------------------
# 背景：单靠 125B 只能串行（带 MTP，同模型两并发 100% 500），并发请求全在网关排队。
# 用户诉求是"不同模型同时干活、每个模型专门负责一个上下文、新上下文排队等空闲模型"，
# 于是把并发做在最安全的那一层 —— **模型之间**：每个模型有自己的 BatchGenerator，
# 一条在 decode、另一条在 prefill 时是真并行；同一模型内部仍然严格串行。
# 三条模型全部 pin 住常驻（max_models=3），由网关的泳道池按优先级分派：
#   flash(rank 100) → mid(50) → light(10)，全忙才排队。
# 与"轻量请求走 27B"的老思路区别：老思路是**替代**（单请求变慢就是亏），这里是
# **叠加**（125B 在忙时，27B 那条线本来闲着，用 34 tok/s 换非零吞吐是纯赚）。
# 代价：三条模型权重合计约 95 GB（68 + 17 + 10），在 256 GB 机器上要给 125B 留够
# 页缓存空间；若观察到 125B decode 掉到 20 tok/s 以下，说明内存吃紧，往下删一条。
#
# 注意：改动本文件后必须重启 gmlx（会掐断在飞流），见 tools/start-flash.py。

server:
  host: 127.0.0.1
  port: 8090
  no_auth: true
  menubar: false
  max_models: 2
  # 分块显式钉在 2048：APC 的检查点只能落在"分块网格"上（lcm(每轮步长, block_size)），
  # 网格越粗，尾部需要重算的 tokens 越多。实测 8192 与 2048 的 prefill 吞吐一致
  # （953 vs 952 tok/s），所以选细的。
  prefill_step_size: 2048
  # 前缀缓存（APC，Automatic Prefix Cache）—— 默认**关闭**。
  # 这是本机最值钱的一个开关：客户端每一轮都把同一段长 system prompt 重发，
  # 缓存关着就等于每轮把几万 tokens 重新 prefill 一遍（实测 24k prompt
  # ttft=25.5s、prefill 956 tok/s）。打开后**完全相同**的 prompt 命中整段，
  # ttft 0.21s；只有末尾几行不同的照样能从最近的检查点续算。
  cache:
    enabled: true
    # 纯注意力架构用块缓存，exact_entries 给混合/循环架构留冗余快照。
    exact_entries: 8
    # 不开 SSD 层：本模型是混合注意力（12 qsa / 36 arr 层），APC 存的是
    # **检查点快照**而不是 KV 块，单个 24k 上下文的快照约 180MB。开磁盘层等于
    # 每个请求往盘上写若干 GB，写放大远大于它省下的那点重启后首次 prefill。
    # 需要时加 disk: {path: ~/.cache/gmlx/apc, max_gb: 40} 即可（path 是开关，
    # 只给 max_gb 不会生效）。

profiles:
  # 只关思维链，不覆盖任何采样参数（空 sampling 不会盖住 family 默认值）。
  # 等价于原命令行里的 --thinking off。
  nothink:
    thinking: off

models:
  qwen3.8-flash-next:
    path: ~/models/qwen3.8-flash-next/Qwen3.8-Flash-Next-UD-Q4_K_XL-00001-of-00004.gguf
    mmproj: ~/models/qwen3.8-flash-next/mmproj-F16.gguf
    profile: nothink
    # MTP 投机解码：drafter 必须与本模型配对，多模型下只能写在模型级
    speculative: true
    draft_gguf: ~/models/flash-drafter/Qwen3.8-Flash-Next-mtp-drafter-Q4_K_L.gguf
    # 投机宽度上限：并发注入到繁忙 batch 时，MTP draft 张量与目标 batch 宽度
    # 不一致会让整批报 "Cannot broadcast ..."。限 1 行可避开该形状冲突。
    speculative_width_cap: 1
    # 主力模型常驻，绝不因 --max-models 被换出
    pin: true

  # 第二条泳道：125B 在忙时的**叠加**（不是替代）。34 tok/s 虽慢，但那条线本来空着。
  # 不带投机 → 走不到 MTP 的 mid-flight 注入缺陷，即使网关放开并发也安全。
  qwen3.8-27b-mlx:
    path: ~/models/extra/qwen3.8-27b.gguf
    mmproj: ~/models/extra/mmproj-qwen3.8-27b.gguf
    profile: nothink
    pin: true

  # 曾经计划过第三条泳道 gemma4-9b（~9.6 GB），实测**不可用**：那个 blob 是基座模型，
  # 模板只有 `{{ .Prompt }}`，chat 请求会立刻吐 EOS（返回空串），completions 则是
  # "The Capital of France is The Capital of France is…" 的复读。所以它只留在
  # gmlx-small.yaml 里当并发实验的负载发生器，不进生产。第三条泳道的坑见 README。

# 不在这里配 aliases。
# gmlx 的 aliases 会被 /v1/models 当成**独立 id** 返回，且字段（resident/pinned/
# family）与真实模型完全一样，网关无法分辨 —— 那样同一个上游模型会因为别名拿到
# 两把串行锁，照样混批。别名统一交给网关的 TG_MODEL_ALIASES 映射到**真实 id**。
